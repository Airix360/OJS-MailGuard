name: Phase 0 Contracts

on:
  push:
    branches:
      - 'phase/**'
      - 'planning/**'
  pull_request:

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint spike PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  upstream-contracts:
    name: Upstream OJS/PKP seam contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source contracts
        run: bash tests/phase0/verify-upstream-contracts.sh
