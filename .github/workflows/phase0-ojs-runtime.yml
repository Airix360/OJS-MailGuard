name: Phase 0 OJS Runtime

on:
  push:
    branches:
      - 'phase/0-integration-spikes'
  pull_request:

jobs:
  ojs-3-5-runtime:
    name: OJS 3.5 / PHP ${{ matrix.php-version }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: ojs
            php-version: 8.2
            database: mysql
          - application: ojs
            php-version: 8.2
            database: pgsql
    steps:
      - uses: pkp/pkp-github-actions@v1
        with:
          node_version: 20
          branch: stable-3_5_0
          repository: pkp
          plugin: true
          dataset_inject: true
